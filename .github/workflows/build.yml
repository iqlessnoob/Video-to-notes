name: Build Video to Study PDF APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install SDK 36.1
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true

      - name: Create .env configuration file
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRUSTED_BACKEND_URL: ${{ secrets.TRUSTED_BACKEND_URL }}
          ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}
          PLAY_BILLING_SUBSCRIPTION_PRODUCT_ID: ${{ secrets.PLAY_BILLING_SUBSCRIPTION_PRODUCT_ID }}
        run: |
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
            echo "TRUSTED_BACKEND_URL=https://api-pending-deployment.videotostudypdf.example.com/" >> .env
            echo "ADMOB_REWARDED_AD_UNIT_ID=UNCONFIGURED_PRODUCTION_AD_UNIT_ID" >> .env
            echo "PLAY_BILLING_SUBSCRIPTION_PRODUCT_ID=UNCONFIGURED_SUBSCRIPTION_PRODUCT_ID" >> .env
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=$GEMINI_API_KEY|" .env
          fi
          if [ -n "$TRUSTED_BACKEND_URL" ]; then
            sed -i "s|^TRUSTED_BACKEND_URL=.*|TRUSTED_BACKEND_URL=$TRUSTED_BACKEND_URL|" .env
          fi
          if [ -n "$ADMOB_REWARDED_AD_UNIT_ID" ]; then
            sed -i "s|^ADMOB_REWARDED_AD_UNIT_ID=.*|ADMOB_REWARDED_AD_UNIT_ID=$ADMOB_REWARDED_AD_UNIT_ID|" .env
          fi
          if [ -n "$PLAY_BILLING_SUBSCRIPTION_PRODUCT_ID" ]; then
            sed -i "s|^PLAY_BILLING_SUBSCRIPTION_PRODUCT_ID=.*|PLAY_BILLING_SUBSCRIPTION_PRODUCT_ID=$PLAY_BILLING_SUBSCRIPTION_PRODUCT_ID|" .env
          fi

      - name: Ensure debug.keystore exists for APK signing
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -di debug.keystore.base64 > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Signed Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Video-to-Study-PDF-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
